# Compila o Sinapse a cada push e pull request, para pegar erros antes de lançar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar (Apple Silicon + Intel)
        run: ./build.sh release
